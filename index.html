<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shakti BI Analytics</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
}

/* Sidebar */
.sidebar {
    width: 250px;
    background: #111827;
    color: white;
    padding: 20px;
}

.sidebar h2 {
    margin-bottom: 30px;
    font-size: 20px;
}

.menu-item {
    padding: 12px;
    margin-bottom: 10px;
    cursor: pointer;
    border-radius: 6px;
    transition: 0.3s;
}

.menu-item:hover {
    background: #1f2937;
}

.active {
    background: #2563eb;
}

/* Main */
.main {
    flex: 1;
    background: #f4f6f9;
    display: flex;
    flex-direction: column;
}

/* Header */
.header {
    padding: 15px 20px;
    background: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.header-title {
    font-weight: bold;
}

/* Buttons */
.header-buttons button {
    margin-left: 10px;
    padding: 6px 12px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.full-btn {
    background: #2563eb;
    color: white;
}

.open-btn {
    background: #10b981;
    color: white;
}

/* Dashboard */
.dashboard-container {
    flex: 1;
    padding: 20px;
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 10px;
}

/* Mobile */
@media(max-width: 768px) {
    .sidebar {
        display: none;
    }
}
</style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
    <h2>Shakti BI</h2>

    <div class="menu-item active" onclick="loadDashboard(0, this)">
        Loss Contribution Analysis
    </div>

    <div class="menu-item" onclick="loadDashboard(1, this)">
        Branch Performance
    </div>
</div>

<!-- Main -->
<div class="main">

    <!-- Header -->
    <div class="header">
        <div class="header-title" id="title">
            Loss Contribution Analysis Dashboard
        </div>

        <div class="header-buttons">
            <button class="full-btn" onclick="openFullscreen()">Full View</button>
            <button class="open-btn" onclick="openNewTab()">Open in New Tab</button>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="dashboard-container">
        <iframe id="dashboardFrame"
        src="https://app.powerbi.com/view?r=eyJrIjoiM2YyYjlhYWUtOGE5OS00MzQ3LTkzOTItMjU5OWE2ZDhhMmU1IiwidCI6IjkwNDk1N2FhLTViZDEtNGI4ZC04MjMxLTg3NGEzYWYwZjEyMSIsImMiOjEwfQ%3D%3D">
        </iframe>
    </div>

</div>

<script>
const dashboards = [
{
title: "Loss Contribution Analysis Dashboard",
link: "https://app.powerbi.com/view?r=eyJrIjoiM2YyYjlhYWUtOGE5OS00MzQ3LTkzOTItMjU5OWE2ZDhhMmU1IiwidCI6IjkwNDk1N2FhLTViZDEtNGI4ZC04MjMxLTg3NGEzYWYwZjEyMSIsImMiOjEwfQ%3D%3D"
},
{
title: "Branch Level Performance Report",
link: "https://app.powerbi.com/view?r=eyJrIjoiZDg1N2FlNWYtN2RmYS00M2Q5LWFmYTEtYjYxODhhMjE4MDA1IiwidCI6IjkwNDk1N2FhLTViZDEtNGI4ZC04MjMxLTg3NGEzYWYwZjEyMSIsImMiOjEwfQ%3D%3D"
}
];

function loadDashboard(index, element) {
    document.getElementById("dashboardFrame").src = dashboards[index].link;
    document.getElementById("title").innerText = dashboards[index].title;

    document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
    element.classList.add('active');
}

function openFullscreen() {
    var iframe = document.getElementById("dashboardFrame");

    if (iframe.requestFullscreen) {
        iframe.requestFullscreen();
    } else if (iframe.webkitRequestFullscreen) {
        iframe.webkitRequestFullscreen();
    } else if (iframe.msRequestFullscreen) {
        iframe.msRequestFullscreen();
    }
}

function openNewTab() {
    const iframe = document.getElementById("dashboardFrame");
    window.open(iframe.src, "_blank");
}
</script>

</body>
</html>
